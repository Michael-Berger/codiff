name: deploy-web

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-web.yml'
      - 'core/**'
      - 'service/**'
      - 'web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://codiff.dev

    steps:
      - uses: actions/checkout@v4

      - name: Install native-keymap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxkbfile-dev

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: true

      - name: Build workspace dependencies
        run: |
          vp run --filter '@nkzw/codiff-core' build
          vp run --filter '@nkzw/codiff-service' build

      - name: Deploy website
        working-directory: web
        env:
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          WRANGLER_LOG: debug
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          vp exec void deploy --platform cloudflare --atomic

      - name: Diagnose failed Cloudflare deploy
        if: failure()
        env:
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-logs
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          files = sorted(Path(os.environ['WRANGLER_LOG_PATH']).glob('*'), key=lambda path: path.stat().st_mtime)
          for path in files[-2:]:
              print(f'Wrangler log: {path.name}')
              for line in path.read_text(errors='replace').splitlines()[-80:]:
                  line = re.sub(r'(?i)(Bearer|Basic)\s+\S+', r'\1 [redacted]', line)
                  line = re.sub(r'(?i)((?:token|secret|password|authorization)["\s:=]+)\S+', r'\1[redacted]', line)
                  print(line[:500])
          PY
